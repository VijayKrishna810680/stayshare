name: Android APK
on:
  workflow_dispatch:
    inputs:
      server_url: { description: "Live StayShare URL the app should load", required: true, default: "https://stayshare.example.com" }
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "mobile-shell/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); just accept licenses non-interactively
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
        env: { CAP_SERVER_URL: "${{ github.event.inputs.server_url || vars.CAP_SERVER_URL || 'https://stayshare.example.com' }}" }
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: stayshare-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
